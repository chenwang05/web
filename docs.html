        @layer utilities {
            .bg-world {
                background: linear-gradient(180deg, #f0f3ee 0%, #f7f5f0 50%, #faf8f3 100%);
                min-height: 100vh;
            }
            .glass-card {
                background-color: #ffffff;

                box-shadow: 0 8px 32px rgba(122, 155, 124, 0.08);
            }
            .glass-card-hover {
                transition: all 0.3s ease;
            }
            .glass-card-hover:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 40px rgba(122, 155, 124, 0.12);
            }
            .glass-nav {
                background-color: rgba(255, 255, 255, 0.95);
                border-bottom: 1px solid #eceae4;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
            .nav-link-hover {
                position: relative;
                cursor: pointer;
            }
            .nav-link-hover::after {
                content: "";
                position: absolute;
                width: 0;
                height: 1.5px;
                left: 50%;
                transform: translateX(-50%);
                bottom: -4px;
                background-color: #7a9b7c;
                transition: width 0.24s ease;
            }
            .nav-link-hover:hover::after {
                width: 100%;
            }
            .dropdown {
                position: relative;
            }
            .dropdown-menu {
                position: absolute;
                top: 100%;
                left: 50%;
                transform: translateX(-50%) translateY(6px);
                min-width: 150px;
                opacity: 0;
                visibility: hidden;
                transition: all 0.22s ease;
                z-index: 60;
                background: #fff;
                border: 1px solid #eceae4;
                box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            }
            .dropdown:hover .dropdown-menu {
                opacity: 1;
                visibility: visible;
                transform: translateX(-50%) translateY(0);
            }
            .page-content {
                position: relative;
                z-index: 1;
            }
            .text-deep {
                color: #2d3a2e;
            }
            .text-mid {
                color: #5a665b;

            .doc-img {

                border: 1px solid #eceae4;

<script>
    document.getElementById('mapLink').href = MAP_VIEW_URL;
    document.getElementById('mapLinkMobile').href = MAP_VIEW_URL;
    
    const nav = document.getElementById('navbar');
    window.addEventListener('scroll',()=>{
        if(window.scrollY>30){
            nav.classList.add("shadow-sm");
        }else{
            nav.classList.remove("shadow-sm");
        }
    })

    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    menuBtn.addEventListener('click',()=>{
        mobileMenu.classList.toggle('hidden');
    })

    document.querySelectorAll('.mobile-dropdown-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('svg');
            content.classList.toggle('hidden');
            icon.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        });
    });

    document.querySelectorAll('.dropdown').forEach(drop => {
        const trigger = drop.querySelector('span');
        const menu = drop.querySelector('.dropdown-menu');
        trigger.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isVisible = menu.style.opacity === '1';
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                m.style.opacity = '0';
                m.style.visibility = 'hidden';
            });
            if (!isVisible) {
                menu.style.opacity = '1';
                menu.style.visibility = 'visible';
                menu.style.transform = 'translateX(-50%) translateY(0)';
            }
        });
    });

    document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
            menu.style.opacity = '0';
            menu.style.visibility = 'hidden';
        });
    });
</script>
